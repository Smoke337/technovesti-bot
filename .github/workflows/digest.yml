name: Утренний дайджест

on:
  schedule:
    # 8:30 по Саратову (UTC+4)
    - cron: "30 4 * * *"
  workflow_dispatch:  # ручной запуск из вкладки Actions

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Опубликовать дайджест
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py --digest

      - name: Сохранить историю публикаций
        run: |
          git config user.name "technovesti-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted.json
          git commit -m "posted: $(date -u +%Y-%m-%dT%H:%MZ)" || echo "Нет изменений"
          git push
          .github/workflows/digest.yml
